<!--
  FoundIt: match, claim and dispute alerts (sent by server/alerts/, WS6).
  Paste this whole file into a new EmailJS template (Content > Edit content >
  Code editor). Set the template's "To Email" to {{to_email}}, "Subject" to
  {{subject}} and the sender name to FoundIt. Its id goes in
  EMAILJS_TEMPLATE_ID.
  The server fills in: {{to_name}}, {{subject}}, {{message}}, {{link}}.
-->
<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{subject}}</title></head>
<body style="margin:0;padding:0;background:#EEF0F6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#EEF0F6;">
<tr><td align="center" style="padding:32px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
<tr><td align="center" style="padding:8px 0 20px;font-family:'Trebuchet MS',Arial,Helvetica,sans-serif;font-size:28px;font-weight:bold;color:#141A44;">Found<span style="color:#A87A1E;">It</span></td></tr>
<tr><td style="background:#FFFFFF;border:1px solid #DCDFEA;border-radius:16px;padding:36px 40px;font-family:Arial,Helvetica,sans-serif;color:#141A44;">
<h1 style="margin:0 0 18px;font-family:'Trebuchet MS',Arial,Helvetica,sans-serif;font-size:24px;line-height:1.25;color:#141A44;">{{subject}}</h1>
<p style="margin:0 0 16px;font-size:16px;line-height:1.5;">Hi {{to_name}},</p>
<p style="margin:0 0 26px;font-size:16px;line-height:1.55;white-space:pre-line;">{{message}}</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td align="center" style="background:#1B2466;border-radius:12px;">
<a href="{{link}}" style="display:inline-block;padding:15px 30px;font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:bold;color:#FFFFFF;text-decoration:none;">Open in FoundIt</a>
</td></tr></table>
<p style="margin:22px 0 0;font-size:13px;line-height:1.5;color:#5D6385;">Button not working? Copy this link:<br><a href="{{link}}" style="color:#1B2466;word-break:break-all;">{{link}}</a></p>
</td></tr>
<tr><td align="center" style="padding:20px 24px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.6;color:#5D6385;">
Sent to {{to_email}} because you have alerts turned on in FoundIt.<br>
You can turn alerts off on your FoundIt profile page.<br>
FoundIt &middot; Lost and found for SMU
</td></tr>
</table></td></tr></table></body></html>
