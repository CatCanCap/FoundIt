<!--
  FoundIt: the 6-digit email code (WS1), used both to confirm the SMU email
  after registering and to reset a forgotten password (the free EmailJS plan
  allows only two templates). Paste this whole file into the EmailJS template
  (Content > Edit content > Code editor). Set the template's "To Email" to
  {{to_email}}, "Subject" to {{subject}} and the sender name to FoundIt. Its id
  goes in EMAILJS_VERIFY_TEMPLATE_ID.
  The server fills in: {{to_email}}, {{to_name}}, {{subject}}, {{otp_code}},
  {{minutes}}, and the sentences that change with the purpose: {{heading}},
  {{intro}}, {{ignore_note}} and {{sent_because}}
  (see server/lib/verification-email.js for their wording).
-->
<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{heading}}</title></head>
<body style="margin:0;padding:0;background:#EEF0F6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#EEF0F6;">
<tr><td align="center" style="padding:32px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
<tr><td align="center" style="padding:8px 0 20px;font-family:'Trebuchet MS',Arial,Helvetica,sans-serif;font-size:28px;font-weight:bold;color:#141A44;">Found<span style="color:#A87A1E;">It</span></td></tr>
<tr><td style="background:#FFFFFF;border:1px solid #DCDFEA;border-radius:16px;padding:36px 40px;font-family:Arial,Helvetica,sans-serif;color:#141A44;">
<h1 style="margin:0 0 18px;font-family:'Trebuchet MS',Arial,Helvetica,sans-serif;font-size:26px;line-height:1.2;color:#141A44;">{{heading}}</h1>
<p style="margin:0 0 16px;font-size:16px;line-height:1.5;">Hi {{to_name}},</p>
<p style="margin:0 0 20px;font-size:16px;line-height:1.5;">{{intro}} It expires in {{minutes}} minutes.</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td align="center" style="background:#F6ECD6;border-radius:12px;padding:22px 20px;">
<div style="font-family:'Courier New',Courier,monospace;font-size:36px;font-weight:bold;letter-spacing:8px;color:#141A44;">{{otp_code}}</div>
</td></tr></table>
<p style="margin:20px 0 0;font-size:14px;line-height:1.5;color:#5D6385;">Never share this code. FoundIt staff and admins will never ask for it by chat, phone or email.</p>
<hr style="border:none;border-top:1px solid #DCDFEA;margin:24px 0 18px;">
<p style="margin:0;font-size:14px;line-height:1.5;color:#5D6385;">{{ignore_note}}</p>
</td></tr>
<tr><td align="center" style="padding:20px 24px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.6;color:#5D6385;">
Sent to {{to_email}} because {{sent_because}}.<br>
FoundIt &middot; Lost and found for SMU
</td></tr>
</table></td></tr></table></body></html>
